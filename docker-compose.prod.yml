# prod override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 필요한 env: FRONTEND_IMAGE, BACKEND_IMAGE, CADDY_IMAGE (Artifact Registry 경로), IMAGE_TAG
services:
  backend:
    build: !reset null
    # 운영 로그는 JSON 한 줄 — Grafana에서 `| json | level="ERROR"` 로 거른다.
    environment:
      LOG_FORMAT: json
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  frontend:
    build: !reset null
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  caddy:
    build: !reset null
    image: ${CADDY_IMAGE}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

