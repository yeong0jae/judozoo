# prod override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 필요한 env: FRONTEND_IMAGE, PYTHON_BACKEND_IMAGE (Artifact Registry 경로), IMAGE_TAG
services:
  python-backend:
    build: !reset null
    image: ${PYTHON_BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  frontend:
    build: !reset null
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  mysql:
    restart: unless-stopped
