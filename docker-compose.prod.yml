services:
  backend:
    build: !reset null
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://alloy:4317
    image: ${BACKEND_IMAGE}:${BACKEND_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  frontend:
    build: !reset null
    ports:
      - "3000:3000"
    image: ${FRONTEND_IMAGE}:${FRONTEND_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
