<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>og.png 원본 — judozoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Noto+Sans+KR:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #e5e8eb;
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: "Noto Sans KR", sans-serif;
      }

      .og {
        width: 1200px;
        height: 630px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 40px;
        padding: 0 88px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }

      .grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, #f1f3f5 1px, transparent 1px),
          linear-gradient(to bottom, #f1f3f5 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: linear-gradient(120deg, transparent 30%, #000 105%);
        -webkit-mask-image: linear-gradient(120deg, transparent 30%, #000 105%);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 20px;
        position: relative;
      }

      .name {
        font-family: "Outfit", sans-serif;
        font-weight: 600;
        font-size: 76px;
        letter-spacing: -0.035em;
        line-height: 1;
        color: #191f28;
      }

      .tagline {
        position: relative;
        margin: 0;
        font-size: 42px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: -0.025em;
        color: #4e5968;
        word-break: keep-all;
      }

      .tagline b {
        color: #191f28;
        font-weight: 500;
      }

      .foot {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        color: #8b95a1;
      }

      .foot .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #f04452;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="grid-bg"></div>

      <div class="row">
        <!-- mark:start -->
        <svg width="84" height="84" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 3V6.4" fill="none" stroke="#191f28" stroke-width="2" stroke-linecap="round"/>
          <rect x="12.7" y="6.4" width="5.6" height="7.6" rx="1.4" fill="#f04452"/>
          <path d="M15.5 14v1.9a3.8 3.8 0 0 1-7.6 0" fill="none" stroke="#191f28" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <!-- mark:end -->
        <span class="name">judozoo</span>
      </div>

      <p class="tagline">
        <b>주도주</b>와 시그널, 지지·저항, 지수·수급을<br />한 화면에
      </p>

      <div class="foot">
        <span class="dot"></span>
        <span>judozoo.com</span>
      </div>
    </div>
  </body>
</html>
