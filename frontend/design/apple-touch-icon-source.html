<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>apple-touch-icon.png 원본 — judozoo</title>
    <!--
      iOS 홈 화면 아이콘(180×180) 원본. 빌드에 포함되지 않는다(public/ 밖).

      내보내는 법:
        1) 이 파일을 브라우저로 연다
        2) 개발자도구 > Elements에서 <div class="icon"> 우클릭 > "Capture node screenshot"
        3) 받은 파일을 frontend/public/apple-touch-icon.png 로 저장 (정확히 180×180)

      iOS는 SVG 파비콘을 받지 않고, 아이콘을 알아서 둥글게 깎으므로 여기서는
      모서리를 굴리지 않고 흰 정사각으로 둔다. 투명 배경도 검게 칠해버려 흰 바탕이 필요하다.
    -->
    <style>
      body {
        margin: 0;
        background: #e5e8eb;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .icon {
        width: 180px;
        height: 180px;
        background: #ffffff;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <!-- mark:start -->
      <svg width="116" height="116" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15.5 3V6.4" fill="none" stroke="#191f28" stroke-width="2" stroke-linecap="round"/>
        <rect x="12.7" y="6.4" width="5.6" height="7.6" rx="1.4" fill="#f04452"/>
        <path d="M15.5 14v1.9a3.8 3.8 0 0 1-7.6 0" fill="none" stroke="#191f28" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <!-- mark:end -->
    </div>
  </body>
</html>
