# Caddy 뒤에 있어서 접속 주소는 늘 Caddy 컨테이너 IP다. 실 클라이언트 IP는
# X-Forwarded-For에만 있다 — 복원하지 않으면 limit_req가 모든 방문자를 한 IP로 묶어
# 서로를 밀어낸다(한 명이 상한을 채우면 나머지가 429).
#
# 홉이 둘이다: 방문자 → Cloudflare 엣지 → Caddy → 여기. `real_ip_recursive`가 XFF를
# 오른쪽부터 되짚다가 **신뢰하지 않는 주소에서 멈추므로**, 도커 대역만 신뢰하면
# Cloudflare 엣지 IP에서 멈춘다 — 방문자 전원이 한 IP로 묶이는 바로 그 상황이다.
# 그래서 엣지 대역도 함께 신뢰한다.
set_real_ip_from 172.16.0.0/12;   # docker 브리지 대역

# Cloudflare 엣지 — 출처 https://www.cloudflare.com/ips-v4 (2026-09-17 기준 15개).
# terraform의 `allowed_web_source_ranges`와 **같은 목록이어야 한다.** 한쪽만 갱신하면
# 방화벽은 통과하는데 IP 복원이 안 되거나, 그 반대가 된다.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

real_ip_header X-Forwarded-For;
real_ip_recursive on;

# /api 상한. 브로커 호출은 공유 리미터에서 최대 20초 대기하고, 그 엔드포인트들이 전부
# sync라 스레드풀(40)을 점유한다. 즉 동시 요청이 몰리면 캐시로 답할 화면까지 같이 멈춘다.
# 여기서 먼저 끊어 그 상황 자체를 만들지 않는다.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API 전체를 백엔드로. 이 nginx는 Caddy 뒤에 있고 호스트에 노출되지 않는다.
  location /api/ {
    # burst=20 nodelay: 화면 하나가 뜰 때 쿼리가 여러 개 동시에 나가는 걸 허용하되,
    # 지속적으로 몰아치는 건 429로 끊는다.
    limit_req          zone=api burst=20 nodelay;
    limit_req_status   429;

    proxy_pass         http://backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback을 쓰지 않는다. 예전에는 없는 주소까지 index.html을 200으로 내줘서,
  # 오타·옛 링크가 전부 유효한 페이지로 보였다(구글은 이걸 soft 404로 본다).
  # 지금은 `build-seo.mjs`가 라우트마다 디렉터리를 구우므로 여기서 갈린다 —
  # 있는 경로는 그 경로의 index.html, 없는 경로는 404.
  #
  # 라우트를 더하고 seo.json을 안 고치면 그 화면이 404가 된다. 빌드가 먼저 세운다.
  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
