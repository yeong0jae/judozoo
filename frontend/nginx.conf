server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Python으로 이관이 끝난 경로. nginx는 더 긴 접두사를 우선하므로 이 블록이 아래 /api/ 보다 먼저 매칭된다.
  # 이관이 진행될수록 여기에 경로를 하나씩 추가한다.
  location /api/news/ {
    proxy_pass         http://python-backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/overseas-leading-stocks/ {
    proxy_pass         http://python-backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # 종목 검색만 이관됐다. 같은 /api/stocks/ 아래 investor/daily는 키움 의존이라
  # 아직 Kotlin이다 — 접두사가 더 긴 이 블록만 Python으로 보낸다.
  location /api/stocks/search {
    proxy_pass         http://python-backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/market/ {
    proxy_pass         http://python-backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/themes/ {
    proxy_pass         http://python-backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/watch-themes {
    proxy_pass         http://python-backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/issues {
    proxy_pass         http://python-backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # 나머지 API는 compose 내부 backend 서비스(8080)로 그대로 프록시
  location /api/ {
    proxy_pass         http://backend:8080;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # STOMP/WebSocket — Upgrade 헤더 보존
  location /ws {
    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_read_timeout 86400s;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
