# Caddy 뒤에 있어서 접속 주소는 늘 Caddy 컨테이너 IP다. 실 클라이언트 IP를 복원하지 않으면
# limit_req가 모든 방문자를 한 IP로 묶어 서로를 밀어낸다(한 명이 상한을 채우면 나머지가 429).
#
# **X-Forwarded-For로는 안 된다.** 홉이 둘인데(방문자 → Cloudflare 엣지 → Caddy → 여기)
# Caddy가 신뢰 프록시로 등록되지 않은 곳에서 온 XFF를 **버리고 자기가 본 IP로 덮어쓴다.**
# 그래서 여기 도착하는 XFF에는 엣지 IP 하나뿐이고 되짚을 것이 없다 — 2026-09-18 운영 로그에서
# 실측했다. 액세스 로그의 IP가 전부 Cloudflare 대역이었고, 원본 XFF 칸도 같은 값이었다.
#
# Cloudflare는 원 방문자 IP를 `CF-Connecting-IP`에 **단일 값**으로 넣고, Caddy는 자기가
# 관리하지 않는 이 헤더를 그대로 넘긴다. 체인이 아니라 값 하나라 `real_ip_recursive`가 필요 없다.
# 위조는 걱정하지 않는다 — 웹 인그레스가 Cloudflare 대역으로만 열려 있어(terraform
# `allowed_web_source_ranges`) 이 헤더를 직접 들고 올 경로가 없다.
#
# 부수 효과로 **Cloudflare 대역 목록을 여기 둘 이유가 사라졌다.** 예전에는 terraform과
# 이 파일 두 곳에 같은 15줄을 유지해야 했고 한쪽만 갱신하면 조용히 어긋났다.
set_real_ip_from 172.16.0.0/12;   # docker 브리지 = 바로 앞의 Caddy
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# /api 상한. 브로커 호출은 공유 리미터에서 최대 20초 대기하고, 그 엔드포인트들이 전부
# sync라 스레드풀(40)을 점유한다. 즉 동시 요청이 몰리면 캐시로 답할 화면까지 같이 멈춘다.
# 여기서 먼저 끊어 그 상황 자체를 만들지 않는다.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API 전체를 백엔드로. 이 nginx는 Caddy 뒤에 있고 호스트에 노출되지 않는다.
  location /api/ {
    # burst=20 nodelay: 화면 하나가 뜰 때 쿼리가 여러 개 동시에 나가는 걸 허용하되,
    # 지속적으로 몰아치는 건 429로 끊는다.
    limit_req          zone=api burst=20 nodelay;
    limit_req_status   429;

    proxy_pass         http://backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback을 쓰지 않는다. 예전에는 없는 주소까지 index.html을 200으로 내줘서,
  # 오타·옛 링크가 전부 유효한 페이지로 보였다(구글은 이걸 soft 404로 본다).
  # 지금은 `build-seo.mjs`가 라우트마다 디렉터리를 구우므로 여기서 갈린다 —
  # 있는 경로는 그 경로의 index.html, 없는 경로는 404.
  #
  # 라우트를 더하고 seo.json을 안 고치면 그 화면이 404가 된다. 빌드가 먼저 세운다.
  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
