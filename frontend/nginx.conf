# 실 클라이언트 IP를 복원하지 않으면 limit_req가 모든 방문자를 앞단 프록시 한 IP로 묶어
# 서로를 밀어낸다(한 명이 상한을 채우면 나머지가 429).
#
# **앞단이 둘이다 (023 전환 기간).** 방문자 IP는 어느 쪽이든 `X-Client-IP` **단일 값**으로 온다.
# - 부하 분산기 → 여기: 백엔드 서비스 커스텀 헤더 `X-Client-IP: {client_ip_address}` (terraform lb.tf)
# - Cloudflare → Caddy → 여기: Caddy가 `CF-Connecting-IP`를 `X-Client-IP`로 옮겨 싣는다 (Caddyfile)
# 헤더를 하나로 맞춰서 `real_ip_header`가 한 줄로 끝난다. 전환이 끝나면 Caddy 줄만 지운다.
#
# **X-Forwarded-For로는 안 된다.** Caddy는 신뢰하지 않는 곳에서 온 XFF를 자기가 본 IP(엣지)로
# 덮어쓰고(2026-09-18 실측), 부하 분산기는 `클라이언트, 부하분산기IP` 모양이라 부하 분산기
# 자기 IP까지 신뢰 목록에 넣어야 한다.
#
# 위조: 이 헤더를 들고 여기 닿을 수 있는 건 아래 대역뿐이다 — 3000은 부하 분산기 대역에만,
# 80/443은 Cloudflare 대역에만 열려 있다(terraform). 방문자가 직접 실은 `X-Client-IP`를
# 부하 분산기가 어떻게 다루는지는 023 §5에서 확인한다.
set_real_ip_from 172.16.0.0/12;    # docker 브리지 = 바로 앞의 Caddy
set_real_ip_from 130.211.0.0/22;   # 구글 부하 분산기 프록시
set_real_ip_from 35.191.0.0/16;    # 구글 부하 분산기 프록시
real_ip_header X-Client-IP;
real_ip_recursive off;

# /api 상한. 브로커 호출은 공유 리미터에서 최대 20초 대기하고, 그 엔드포인트들이 전부
# sync라 스레드풀(40)을 점유한다. 즉 동시 요청이 몰리면 캐시로 답할 화면까지 같이 멈춘다.
# 여기서 먼저 끊어 그 상황 자체를 만들지 않는다.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API 전체를 백엔드로. 이 nginx는 Caddy 뒤에 있고 호스트에 노출되지 않는다.
  location /api/ {
    # burst=20 nodelay: 화면 하나가 뜰 때 쿼리가 여러 개 동시에 나가는 걸 허용하되,
    # 지속적으로 몰아치는 건 429로 끊는다.
    limit_req          zone=api burst=20 nodelay;
    limit_req_status   429;

    proxy_pass         http://backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback을 쓰지 않는다. 예전에는 없는 주소까지 index.html을 200으로 내줘서,
  # 오타·옛 링크가 전부 유효한 페이지로 보였다(구글은 이걸 soft 404로 본다).
  # 지금은 `build-seo.mjs`가 라우트마다 디렉터리를 구우므로 여기서 갈린다 —
  # 있는 경로는 그 경로의 index.html, 없는 경로는 404.
  #
  # 라우트를 더하고 seo.json을 안 고치면 그 화면이 404가 된다. 빌드가 먼저 세운다.
  # 부하 분산기 상태 확인. `/`를 쓰면 프로버 여러 대의 요청이 액세스 로그(Loki)에 쌓인다.
  location = /healthz {
    access_log off;
    return 200;
  }

  # 해시가 붙은 빌드 산출물 — 내용이 바뀌면 이름이 바뀐다. 한 번 받으면 다시 묻지 않는다.
  # Cloud CDN(`USE_ORIGIN_HEADERS`)도 이 헤더를 보고 엣지에 둔다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 나머지(HTML·robots.txt·favicon 등)는 매번 확인한다. 헤더가 없으면 브라우저가 last-modified로
  # 캐시 기간을 추측해서, 배포 뒤 옛 HTML이 사라진 해시 자산을 가리키면 화면이 빈다(023).
  # 확인은 ETag로 304가 나서 싸다.
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
}
