# Caddy 뒤에 있어서 접속 주소는 늘 Caddy 컨테이너 IP다. 실 클라이언트 IP는
# X-Forwarded-For에만 있다 — 복원하지 않으면 limit_req가 모든 방문자를 한 IP로 묶어
# 서로를 밀어낸다(한 명이 상한을 채우면 나머지가 429).
set_real_ip_from 172.16.0.0/12;   # docker 브리지 대역
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# /api 상한. 브로커 호출은 공유 리미터에서 최대 20초 대기하고, 그 엔드포인트들이 전부
# sync라 스레드풀(40)을 점유한다. 즉 동시 요청이 몰리면 캐시로 답할 화면까지 같이 멈춘다.
# 여기서 먼저 끊어 그 상황 자체를 만들지 않는다.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API 전체를 백엔드로. 이 nginx는 Caddy 뒤에 있고 호스트에 노출되지 않는다.
  location /api/ {
    # burst=20 nodelay: 화면 하나가 뜰 때 쿼리가 여러 개 동시에 나가는 걸 허용하되,
    # 지속적으로 몰아치는 건 429로 끊는다.
    limit_req          zone=api burst=20 nodelay;
    limit_req_status   429;

    proxy_pass         http://backend:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
