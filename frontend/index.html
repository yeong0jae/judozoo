<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS는 SVG 파비콘을 받지 않는다. design/apple-touch-icon-source.html에서 180×180으로 내보낸다. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>주도주와 시그널을 한 화면에 : judozoo</title>
    <meta
      name="description"
      content="주도주와 시그널, 지지·저항, 지수·수급을 한 화면에 모아 보여줍니다."
    />

    <!-- 링크 미리보기(카톡·슬랙 등). og.png는 design/og-source.html을 1200×630으로 내보내 만든다. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://judozoo.com/" />
    <meta property="og:site_name" content="judozoo" />
    <meta property="og:title" content="judozoo · 주도주와 시그널을 한 화면에" />
    <meta
      property="og:description"
      content="주도주와 시그널, 지지·저항, 지수·수급을 한 화면에 모아 보여줍니다."
    />
    <meta property="og:image" content="https://judozoo.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // FOUC 방지 — React 렌더 전에 저장된 테마를 동기 적용.
      // ThemeProvider와 동일한 키('at.theme')·로직·기본값(dark) 사용.
      (function () {
        try {
          var m = localStorage.getItem("at.theme");
          if (m !== "light" && m !== "dark" && m !== "system") m = "dark";
          var dark =
            m === "dark" ||
            (m === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
