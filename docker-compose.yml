services:
  backend:
    build: ./backend
    environment:
      TZ: Asia/Seoul
      DB_NAME: trading
    env_file:
      - ./secrets/.env
    expose:
      - "8001"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - trading

  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - trading

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /proc:/host/proc:ro
    labels:
      config.hash: ${ALLOY_CONFIG_HASH}
    networks:
      - trading

volumes:
  alloy-data:

networks:
  trading:
    driver: bridge
