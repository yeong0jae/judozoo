# base: 로컬 개발/CI/프로덕션 공통.
# - 로컬: docker compose up --build  (이 파일만 사용)
# - 프로덕션: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# secrets/.env 가 있어야 부팅됨 (KIS/KIWOOM/토스 시크릿 + DB_PASSWORD).
# 파일은 git에 올리지 않는다 — 배포 시 remote_deploy.sh가 Secret Manager에서 받아 쓴다.
services:
  # Python 백엔드. nginx가 /api/ 중 Kotlin으로 옮기지 않은 경로를 여기로 보낸다(028).
  # 컨테이너 기본 UTC면 KST 기준 cron·벽시계가 9시간 어긋나므로 TZ를 고정한다.
  backend:
    build: ./backend
    environment:
      TZ: Asia/Seoul
      DB_NAME: trading
      # 트레이스를 alloy의 OTLP 수신구로 보낸다(021). 같은 compose 네트워크라
      # 호스트 포트가 필요 없다. 비우면 계측 자체가 꺼진다 — 로컬 기본값이 그렇다.
      OTLP_ENDPOINT: alloy:4317
      # 키움 조회 한도(초당 5, 09~10시 3)를 Kotlin과 나눠 쓴다(028). Kotlin은 1/1 — 합이 한도를 넘지 않게
      # 여기서 줄인다. 기능을 더 옮길 때마다 이 몫을 줄이고 Kotlin 몫(`JUDOZOO_KIWOOM_*`)을 늘린다.
      KIWOOM_QUERY_PERMITS_PER_SECOND: "4"
      KIWOOM_PEAK_QUERY_PERMITS_PER_SECOND: "2"
      # DB_HOST·DB_PORT·DB_USERNAME은 secrets/.env가 준다 (remote_deploy.sh가 씀).
      # 여기 environment에 적으면 env_file을 덮어쓰고, ${...} 보간은 env_file을
      # 읽지 못해 빈 값이 된다 — grafana 쪽에서 이미 겪은 함정이다.
    env_file:
      - ./secrets/.env
    expose:
      - "8000"
    # 이미지에 curl이 없어 python으로 검사한다. 배포 스크립트가 이 상태를 보고 실패를 감지한다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - trading

  # Kotlin 백엔드(028). 기능 단위로 옮기는 중이라 nginx가 옮긴 경로만 여기로 보낸다.
  # Python과 같은 DB·같은 secrets/.env를 쓴다. 스키마는 건드리지 않는다(JPA validate).
  backend-kotlin:
    build: ./backend-kotlin
    environment:
      TZ: Asia/Seoul
      DB_NAME: trading
    env_file:
      - ./secrets/.env
    expose:
      - "8001"
    # 힙은 이 한도의 70%다(Dockerfile `MaxRAMPercentage`). 빈 앱이 330MB쯤 쓴다.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # JVM 기동이 Python보다 느리다
      start_period: 40s
    networks:
      - trading

  frontend:
    build: ./frontend
    # nginx는 기동 때 upstream 이름을 푼다 — 없으면 nginx가 뜨지 않는다
    depends_on:
      - backend
      - backend-kotlin
    networks:
      - trading

  # 로그 수집/저장/조회 스택 (Alloy 스크레이프 → Loki → Grafana)
  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      # 내장 exporter(unix)가 호스트를 읽는 통로. **config.alloy의 경로
      # 인자와 짝이다 — 하나라도 빠지면 alloy가 exit 1로 죽고 로그 수집까지 멈춘다.**
      # /proc은 컨테이너 자기 것을 덮으면 안 되므로 /host/proc으로 받는다.
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /proc:/host/proc:ro
    # 설정이 바뀔 때만 재생성된다(ops 스택과 같은 방식). 예전에는 배포마다
    # --force-recreate로 무조건 재시작했다 — 설정 파일이 단일 파일 bind mount라
    # 내용만 갈아끼워서는 프로세스가 새 설정을 안 읽기 때문이었다.
    labels:
      config.hash: ${ALLOY_CONFIG_HASH}
    networks:
      - trading

volumes:
  alloy-data:

networks:
  trading:
    driver: bridge
