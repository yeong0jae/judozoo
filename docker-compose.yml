# base: 로컬 개발/CI/프로덕션 공통.
# - 로컬: docker compose up --build  (이 파일만 사용)
# - 프로덕션: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# secrets/.env 가 있어야 부팅됨 (KIS/KIWOOM/토스 시크릿 + DB_PASSWORD).
# 파일은 git에 올리지 않는다 — 배포 시 remote_deploy.sh가 Secret Manager에서 받아 쓴다.
services:
  # 유일한 백엔드. nginx가 /api/ 전체를 여기로 보낸다.
  # 컨테이너 기본 UTC면 KST 기준 cron·벽시계가 9시간 어긋나므로 TZ를 고정한다.
  backend:
    build: ./backend
    environment:
      TZ: Asia/Seoul
      DB_NAME: trading
      # DB_HOST·DB_PORT·DB_USERNAME은 secrets/.env가 준다 (remote_deploy.sh가 씀).
      # 여기 environment에 적으면 env_file을 덮어쓰고, ${...} 보간은 env_file을
      # 읽지 못해 빈 값이 된다 — grafana 쪽에서 이미 겪은 함정이다.
    env_file:
      - ./secrets/.env
    expose:
      - "8000"
    # 이미지에 curl이 없어 python으로 검사한다. 배포 스크립트가 이 상태를 보고 실패를 감지한다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - trading

  # TLS 종단 + 호스트 기반 라우팅. 인증서는 DNS-01로 자동 발급·갱신한다.
  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
    # DOMAIN / CLOUDFLARE_API_TOKEN
    env_file:
      - ./secrets/.env
    volumes:
      # 발급받은 인증서가 여기 저장된다. 휘발되면 배포마다 재발급해서
      # Let's Encrypt 주간 발급 한도를 태운다 — 반드시 명명 볼륨이어야 한다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    networks:
      - trading

  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - trading

  # 로그 수집/저장/조회 스택 (Alloy 스크레이프 → Loki → Grafana)
  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      # 내장 exporter(unix·cadvisor)가 호스트를 읽는 통로. **config.alloy의 경로
      # 인자와 짝이다 — 하나라도 빠지면 alloy가 exit 1로 죽고 로그 수집까지 멈춘다.**
      # /proc은 컨테이너 자기 것을 덮으면 안 되므로 /host/proc으로 받는다.
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /proc:/host/proc:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - trading

volumes:
  caddy-data:
  caddy-config:
  alloy-data:

networks:
  trading:
    driver: bridge
