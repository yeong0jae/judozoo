# base: 로컬 개발/CI/프로덕션 공통.
# - 로컬: docker compose up --build  (이 파일만 사용)
# - 프로덕션: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# backend/.env 가 있어야 backend가 부팅됨 (KIS/KIWOOM 시크릿 + DB_PASSWORD).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trading
      TZ: Asia/Seoul
    env_file:
      - ./backend/.env       # MYSQL_ROOT_PASSWORD 주입 (DB_PASSWORD와 동일 값)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - trading

  backend:
    build: ./backend
    # 컨테이너 기본 UTC → LocalDateTime.now()가 9h 어긋남. KST 고정.
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-kis-real}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trading?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      DB_USERNAME: root
    env_file:
      - ./backend/.env
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trading

  # Kotlin 백엔드에서 이관이 끝난 경로만 nginx가 이쪽으로 보낸다(현재 /api/news/).
  # 남은 경로는 계속 backend(8080)로 간다.
  python-backend:
    build: ./python-backend
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: trading
      DB_USERNAME: root
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    # 이미지에 curl이 없어 python으로 검사한다. 배포 스크립트가 이 상태를 보고 실패를 감지한다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trading

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - trading

  # 로그 수집/저장/조회 스택 (Alloy 스크레이프 → Loki → Grafana)
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - trading

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - trading

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - trading

volumes:
  mysql-data:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  trading:
    driver: bridge
