# base: 로컬 개발/CI/프로덕션 공통.
# - 로컬: docker compose up --build  (이 파일만 사용)
# - 프로덕션: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# backend/.env 가 있어야 backend가 부팅됨 (KIS/KIWOOM 시크릿 + DB_PASSWORD).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trading
      TZ: Asia/Seoul
    env_file:
      - ./backend/.env       # MYSQL_ROOT_PASSWORD 주입 (DB_PASSWORD와 동일 값)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - trading

  backend:
    build: ./backend
    # 컨테이너 기본 UTC → LocalDateTime.now()가 9h 어긋남. KST 고정.
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-kis-vts}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trading?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      DB_USERNAME: root
    env_file:
      - ./backend/.env
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trading

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - trading

volumes:
  mysql-data:

networks:
  trading:
    driver: bridge
