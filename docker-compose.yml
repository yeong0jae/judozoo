# base: 로컬 개발/CI/프로덕션 공통.
# - 로컬: docker compose up --build  (이 파일만 사용)
# - 프로덕션: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# secrets/.env 가 있어야 부팅됨 (KIS/KIWOOM/토스 시크릿 + DB_PASSWORD).
# 파일은 git에 올리지 않는다 — 배포 시 remote_deploy.sh가 Secret Manager에서 받아 쓴다.
services:
  # 유일한 백엔드. nginx가 /api/ 전체를 여기로 보낸다.
  # 컨테이너 기본 UTC면 KST 기준 cron·벽시계가 9시간 어긋나므로 TZ를 고정한다.
  backend:
    build: ./backend
    environment:
      TZ: Asia/Seoul
      DB_NAME: trading
      # DB_HOST·DB_PORT·DB_USERNAME은 secrets/.env가 준다 (remote_deploy.sh가 씀).
      # 여기 environment에 적으면 env_file을 덮어쓰고, ${...} 보간은 env_file을
      # 읽지 못해 빈 값이 된다 — grafana 쪽에서 이미 겪은 함정이다.
    env_file:
      - ./secrets/.env
    expose:
      - "8000"
    # 이미지에 curl이 없어 python으로 검사한다. 배포 스크립트가 이 상태를 보고 실패를 감지한다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - trading

  # TLS 종단 + 호스트 기반 라우팅. 인증서는 DNS-01로 자동 발급·갱신한다.
  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
    # DOMAIN / CLOUDFLARE_API_TOKEN
    env_file:
      - ./secrets/.env
    volumes:
      # 발급받은 인증서가 여기 저장된다. 휘발되면 배포마다 재발급해서
      # Let's Encrypt 주간 발급 한도를 태운다 — 반드시 명명 볼륨이어야 한다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    networks:
      - trading

  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - trading

  # 로그 수집/저장/조회 스택 (Alloy 스크레이프 → Loki → Grafana)
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - trading

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - trading

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      # 다른 컨테이너는 KST인데 여기만 UTC면 로그·기본 표시가 9시간 어긋난다.
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_USER: admin
    # IAP 터널이 VM의 네트워크 인터페이스로 붙으므로 호스트 포트가 필요하다.
    # 127.0.0.1에 묶으면 IAP가 닿지 못한다 — 0.0.0.0이어야 한다.
    # 인터넷 노출은 없다: GCP 방화벽이 3000을 IAP 대역(REDACTED_IP/20)에만 연다.
    ports:
      - "3000:3000"
    # GF_SECURITY_ADMIN_PASSWORD가 여기 들어온다 (Secret Manager → remote_deploy.sh).
    # compose 보간(${...})은 env_file을 못 읽으므로 컨테이너에 직접 주입해야 한다.
    env_file:
      - ./secrets/.env
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - trading

volumes:
  caddy-data:
  caddy-config:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  trading:
    driver: bridge
