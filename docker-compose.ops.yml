# 관측 전용 VM(judozoo-ops-prod)의 스택. 앱 VM의 docker-compose.yml과 겹치지 않는다.
#
#   docker compose -f docker-compose.ops.yml -f docker-compose.ops.prod.yml up -d
#
# 수집기(alloy)는 여기 없다. 걷을 것이 loki·grafana 자기 로그뿐인데 바로 옆 Loki로
# 밀어 넣는 구조라, Loki가 죽으면 그 사실을 남길 곳도 같이 죽는다. 반쪽짜리에
# 95MB를 쓰지 않는다 — ops 스택 문제는 SSH + docker logs 로 본다.
services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    # 앱 VM의 alloy가 **다른 머신에서** 붙는다. 같은 compose 네트워크 안에서만 쓰던
    # 때와 달라지는 지점이다. 인터넷 노출은 없다 — 이 VM에는 외부 IP가 없고,
    # judozoo-ops-allow-loki 가 tag auto-trading 에서 오는 3100만 연다.
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - ops

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30일과 4GB 중 **먼저 닿는 쪽**이 이긴다. 부트디스크가 20GB뿐이라 크기 상한이
      # 실질적인 방어선이다. 로그(7일)보다 긴 이유는 메트릭이 "지난달 대비"를 보는 물건이라서다.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
      # **이게 없으면 alloy의 push가 404로 조용히 버려진다.** 수신은 기본으로 꺼져 있다.
      - --web.enable-remote-write-receiver
    # 앱 VM의 alloy가 **다른 머신에서** 붙는다 — Loki 3100과 같은 이유로 호스트에 낸다.
    # 인터넷 노출은 없다(이 VM에는 외부 IP가 없다).
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ops

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      # 다른 컨테이너는 KST인데 여기만 UTC면 로그·기본 표시가 9시간 어긋난다.
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_USER: admin
    # IAP 터널이 VM의 네트워크 인터페이스로 붙으므로 호스트 포트가 필요하다.
    # 127.0.0.1에 묶으면 IAP가 닿지 못한다 — 0.0.0.0이어야 한다.
    ports:
      - "3000:3000"
    # GF_SECURITY_ADMIN_PASSWORD · GF_MYSQL_PASSWORD · DB_HOST 가 여기 들어온다.
    # compose 보간(${...})은 env_file을 못 읽으므로 컨테이너에 직접 주입해야 한다.
    env_file:
      - ./secrets/.env
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    networks:
      - ops

# 별도 PD를 붙이지 않는다. 대시보드는 git(프로비저닝 바인드)에 있고 로그는 7일짜리라,
# VM을 재생성해도 잃을 것이 사용자 설정과 지난 로그뿐이다.
volumes:
  loki-data:
  grafana-data:
  # 명명 볼륨이어야 한다 — Prometheus 이미지는 nobody(65534)로 돌고,
  # 바인드로 바꾸면 소유권이 안 맞아 기동에 실패한다.
  prometheus-data:

networks:
  ops:
    driver: bridge
