services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    labels:
      config.hash: ${LOKI_CONFIG_HASH}
    networks:
      - ops

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    labels:
      config.hash: ${PROMETHEUS_CONFIG_HASH}
    networks:
      - ops

  tempo:
    image: grafana/tempo:2.10.8
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "4317:4317"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    labels:
      config.hash: ${TEMPO_CONFIG_HASH}
    networks:
      - ops

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - "3000:3000"
    env_file:
      - ./secrets/.env
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    labels:
      config.hash: ${GRAFANA_CONFIG_HASH}
    networks:
      - ops

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  tempo-data:

networks:
  ops:
    driver: bridge
