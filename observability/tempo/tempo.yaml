server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 168h

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

usage_report:
  reporting_enabled: false
