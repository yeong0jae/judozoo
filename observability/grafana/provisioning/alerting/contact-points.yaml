# Slack 수신처. **웹훅 URL은 저장소에 없다** — remote_deploy_ops.sh가 Secret Manager의
# AT_GRAFANA_SLACK_WEBHOOK_URL을 secrets/.env에 적고, Grafana가 $SLACK_WEBHOOK_URL로 읽는다
# (datasources/mysql.yaml의 $DB_HOST와 같은 방식).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-webhook
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
          title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}'
          # 알림을 받고 바로 판단할 수 있어야 한다 — 어디서 났는지와 몇 건인지.
          # job_id는 스케줄러 규칙에만 있다. 로그 규칙에는 없으므로 있을 때만 앞에 붙인다 —
          # 조건 없이 쓰면 로그 알림이 `** — ...`로 온다.
          text: |
            {{ range .Alerts }}{{ if .Labels.job_id }}*{{ .Labels.job_id }}* — {{ end }}{{ .Annotations.summary }}
            {{ end }}

  # 가입 알림 전용. 채널이 다르므로 웹훅이 따로다(AT_GRAFANA_SLACK_SIGNUP_WEBHOOK_URL).
  #
  # `disableResolveMessage: true` — 가입은 **상태가 아니라 사건**이다. 해소 메시지를 켜두면
  # 한 명 가입에 "발동"과 "해소" 두 개가 온다. 장애 알림은 "돌아왔다"가 중요하지만
  # 여기서는 의미가 없다.
  - orgId: 1
    name: slack-signup
    receivers:
      - uid: slack-signup-webhook
        type: slack
        disableResolveMessage: true
        settings:
          url: $SIGNUP_SLACK_WEBHOOK_URL
          title: '🎉 {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}

  # 의견 수신처. **가입과 같은 웹훅을 쓴다** — 둘 다 "나쁜 일이 아닌 알림"이라 채널이 같고,
  # 시크릿을 하나 더 만들 값어치가 없다. 나중에 채널을 가르고 싶어지면 여기 url만
  # 새 환경변수로 바꾸면 되고, 규칙과 라우트는 손댈 것이 없다.
  #
  # 가입과 같은 이유로 `disableResolveMessage: true` — 의견은 상태가 아니라 사건이다.
  - orgId: 1
    name: slack-feedback
    receivers:
      - uid: slack-feedback-webhook
        type: slack
        disableResolveMessage: true
        settings:
          url: $SIGNUP_SLACK_WEBHOOK_URL
          title: '💬 {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}

  # 탈퇴 수신처. 가입·의견과 같은 웹훅 — 같은 이유로 해소 메시지를 끈다(사건이지 상태가 아니다).
  - orgId: 1
    name: slack-withdraw
    receivers:
      - uid: slack-withdraw-webhook
        type: slack
        disableResolveMessage: true
        settings:
          url: $SIGNUP_SLACK_WEBHOOK_URL
          title: '👋 {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}
