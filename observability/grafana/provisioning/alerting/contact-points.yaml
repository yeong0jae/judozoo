apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-webhook
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
          title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ if .Labels.job_id }}*{{ .Labels.job_id }}* — {{ end }}{{ .Annotations.summary }}
            {{ end }}

  - orgId: 1
    name: slack-signup
    receivers:
      - uid: slack-signup-webhook
        type: slack
        disableResolveMessage: true
        settings:
          url: $SIGNUP_SLACK_WEBHOOK_URL
          title: '🎉 {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}

  - orgId: 1
    name: slack-feedback
    receivers:
      - uid: slack-feedback-webhook
        type: slack
        disableResolveMessage: true
        settings:
          url: $SIGNUP_SLACK_WEBHOOK_URL
          title: '💬 {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}

  - orgId: 1
    name: slack-withdraw
    receivers:
      - uid: slack-withdraw-webhook
        type: slack
        disableResolveMessage: true
        settings:
          url: $SIGNUP_SLACK_WEBHOOK_URL
          title: '👋 {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}
