# Slack 수신처. **웹훅 URL은 저장소에 없다** — remote_deploy_ops.sh가 Secret Manager의
# AT_GRAFANA_SLACK_WEBHOOK_URL을 secrets/.env에 적고, Grafana가 $SLACK_WEBHOOK_URL로 읽는다
# (datasources/mysql.yaml의 $DB_HOST와 같은 방식).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-webhook
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
          title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}'
          # 알림을 받고 바로 판단할 수 있어야 한다 — 어디서 났는지와 몇 건인지.
          # job_id는 스케줄러 규칙에만 있다. 로그 규칙에는 없으므로 있을 때만 앞에 붙인다 —
          # 조건 없이 쓰면 로그 알림이 `** — ...`로 온다.
          text: |
            {{ range .Alerts }}{{ if .Labels.job_id }}*{{ .Labels.job_id }}* — {{ end }}{{ .Annotations.summary }}
            {{ end }}
