# 기본 라우트는 Slack(장애). 가입 알림만 `kind=signup` 라벨로 갈라 다른 채널로 보낸다.
apiVersion: 1

policies:
  - orgId: 1
    receiver: slack
    group_by: [alertname, job_id]
    group_wait: 30s
    group_interval: 5m
    # 안 고치면 4시간마다 다시 알린다. 조용히 사라지는 것보다 낫다.
    repeat_interval: 4h
    # 가입은 장애가 아니다. 채널도 성격도 달라서 갈라 보낸다.
    routes:
      - receiver: slack-signup
        matchers:
          - kind = signup
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        # 한 번 알리면 끝이다. 안 고치면 다시 알릴 성질의 것이 아니라 길게 둔다.
        repeat_interval: 24h
