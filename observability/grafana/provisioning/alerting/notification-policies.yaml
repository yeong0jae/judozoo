apiVersion: 1

policies:
  - orgId: 1
    receiver: slack
    group_by: [alertname, job_id]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: slack-signup
        matchers:
          - kind = signup
        group_by: [alertname, id]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
      - receiver: slack-feedback
        matchers:
          - kind = feedback
        group_by: [alertname, id]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
      - receiver: slack-withdraw
        matchers:
          - kind = withdraw
        group_by: [alertname, user]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
