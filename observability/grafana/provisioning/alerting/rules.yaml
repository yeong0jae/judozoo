# 대시보드 "메트릭" ②번 패널에 대응하는 알림.
#
# **이 패널만 알림을 붙이는 이유** — 나머지 패널은 상태를 보여주지만 여기만 "지금 뭔가
# 잘못됐다"를 보여준다. 평소 완전히 비어 있는 게 정상인 유일한 패널이다.
#
# 문턱을 0이 아니라 3으로 둔 이유: 브로커 네트워크가 한 번 튀는 것으로 울리면 알림을
# 끄게 된다. 10초 폴러가 진짜 깨지면 10분에 60번 실패하므로 3은 여전히 낮은 문턱이다.
apiVersion: 1

groups:
  - orgId: 1
    name: 스케줄러
    folder: judozoo
    interval: 1m
    rules:
      # ── 삼켜진 실패 ───────────────────────────────────────────────
      # 폴러가 예외를 log.warning으로 흘리고 정상 리턴한다 — APScheduler에는 성공으로
      # 보이므로 scheduler_job_runs_total로는 영영 안 잡힌다.
      - uid: scheduler-swallowed-errors
        title: 스케줄러 잡이 실패를 삼키고 있다
        condition: THRESHOLD
        for: 2m
        # 배포 중 backend가 잠깐 사라지면 시계열이 끊긴다. 그걸로 울리지 않는다.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 {{ $values.QUERY.Value }}건 실패 — 화면은 멀쩡하고 로그에만 warning이 남는다'
          runbook: 'docs/tasks/020-prometheus-메트릭.md'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: QUERY
              instant: true
              expr: sum by (job_id) (increase(scheduler_job_errors_total[10m]))
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [2]

      # ── 미스파이어 ────────────────────────────────────────────────
      # 이전 실행이 안 끝나 다음 차례를 건너뛴 것. 폴러가 밀리고 있다는 뜻이고
      # 로그에는 아무것도 안 남는다.
      - uid: scheduler-missed-runs
        title: 스케줄러 잡이 밀리고 있다
        condition: THRESHOLD
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 {{ $values.QUERY.Value }}회 미스파이어 — 잡 소요가 폴링 주기를 넘고 있다'
          runbook: 'docs/tasks/020-prometheus-메트릭.md'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: QUERY
              instant: true
              expr: sum by (job_id) (increase(scheduler_job_runs_total{result="missed"}[10m]))
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [2]

  # ── 로그 ─────────────────────────────────────────────────────────
  # 위 두 규칙은 Prometheus를 보지만 여기는 Loki를 본다. 메트릭에 안 잡히는 실패 —
  # 요청 처리 중 터진 예외, 브로커 응답 이상 — 는 로그에만 남는다.
  #
  # **문턱은 실측으로 정했다 (2026-09-18, 지난 24시간을 10분 창으로).**
  #
  #   전체 backend ERROR     중앙 2건 · p90 7건 · 24시간 최대 11건
  #   backend.main(=사용자 500)  중앙 1건 · 24시간 최대 3건
  #
  # 즉 **에러는 평소에도 난다.** 대부분 브로커(KIS·키움)가 간헐적으로 5xx를 주는 것이고
  # 스스로 회복한다. 0건에서 울리게 두면 하루 150건이 슬랙에 쌓이고, 그러면 알림을 끄게 된다 —
  # 위 스케줄러 규칙이 문턱을 3으로 둔 것과 같은 판단이다.
  # 그래서 **24시간 최대치보다 위**에 둔다. 지난 24시간이라면 한 번도 안 울렸을 값이다.
  # 이건 "에러가 났다"가 아니라 "평소와 다르다"를 알리는 장치다.
  - orgId: 1
    name: 로그
    folder: judozoo
    interval: 1m
    rules:
      # ── 에러 급증 ─────────────────────────────────────────────────
      - uid: log-error-storm
        title: 에러 로그가 쏟아지고 있다
        condition: THRESHOLD
        for: 2m
        # 배포 중 backend가 잠깐 사라지면 로그가 끊긴다. 그걸로 울리지 않는다.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 backend ERROR {{ $values.QUERY.Value }}건 (평소 중앙 2건, 24시간 최대 11건)'
          runbook: 'Grafana "Log Monitoring"에서 Level=error로 좁혀 본다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: QUERY
              datasource: { type: loki, uid: loki }
              queryType: instant
              expr: 'sum(count_over_time({service="backend"} | json | level = "ERROR" [10m]))'
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [15]

      # ── 사용자에게 나간 500 ────────────────────────────────────────
      # `backend.main`의 "Unhandled exception"은 전역 핸들러가 잡은 것이다.
      # 곧 **화면이 깨져 보인 사람이 있다**는 뜻이라, 전체 에러보다 낮은 문턱을 쓴다.
      - uid: log-unhandled-exception
        title: 사용자에게 500이 나가고 있다
        condition: THRESHOLD
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 처리 못 한 예외 {{ $values.QUERY.Value }}건 — 그만큼 500을 받은 요청이 있다'
          runbook: 'Grafana "사용자 여정"에서 그 사용자의 에러 패널을 본다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: QUERY
              datasource: { type: loki, uid: loki }
              queryType: instant
              expr: 'sum(count_over_time({service="backend"} | json | level = "ERROR" | logger = "backend.main" [10m]))'
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

  # ── 가입 ─────────────────────────────────────────────────────────
  # 유일하게 "나쁜 일"이 아닌 알림이다. 그래서 채널도 수신처도 갈라 둔다
  # (notification-policies.yaml 의 kind=signup 라우트).
  #
  # **로그가 아니라 DB를 본다.** `app_user`에 행이 생긴 것이 곧 가입이라 의미가 정확하고,
  # alloy→Loki 파이프라인을 안 거쳐 중간에 끊길 데가 없다.
  #
  # 창을 10분으로 두고 `for`를 두지 않는다 — 장애 규칙과 달리 "잠깐 튄 것"이 없다.
  # 한 건이라도 생기면 바로 알린다.
  #
  # **인원수가 아니라 한 명씩 알린다.** 쿼리가 가입자 한 행씩 돌려주고, 문자열 컬럼은
  # 알림 인스턴스의 라벨이 된다. 덕분에 문구에 언제·누구를 담을 수 있다. 같은 창에
  # 둘이 들어오면 인스턴스가 둘이고, 수신처 템플릿이 `range .Alerts`라 두 줄로 온다.
  - orgId: 1
    name: 가입
    folder: judozoo
    interval: 1m
    rules:
      - uid: new-signup
        title: 신규 가입
        condition: THRESHOLD
        # DB를 못 읽었을 때 "가입 0명"으로 읽으면 안 된다. 조용히 넘긴다.
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          kind: signup
        annotations:
          summary: '{{ $labels.at }}, {{ $labels.id }}번 사용자가 가입했습니다'
          runbook: 'Grafana "이용 현황"의 가입자 표에서 번호로 누구인지 본다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: judozoo-mysql
            model:
              refId: QUERY
              datasource: { type: mysql, uid: judozoo-mysql }
              format: table
              rawQuery: true
              # `id`를 CAST로 문자열로 만든다 — 숫자 컬럼이 둘이면 Grafana가 어느 쪽이
              # 값인지 못 정한다. 문자열이라야 라벨로 잡힌다.
              # 시각은 앱도 DB도 KST 벽시계라(main.tf의 default_time_zone=+09:00,
              # docker-compose의 TZ=Asia/Seoul) 보정 없이 그대로 찍으면 된다.
              rawSql: "SELECT CAST(id AS CHAR) AS id, DATE_FORMAT(created_at, '%m-%d %H:%i') AS at, 1 AS value FROM app_user WHERE created_at >= NOW() - INTERVAL 10 MINUTE;"
          - refId: REDUCE
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: REDUCE
              type: reduce
              expression: QUERY
              reducer: last
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: REDUCE
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
