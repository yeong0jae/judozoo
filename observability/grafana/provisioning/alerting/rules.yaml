apiVersion: 1

groups:
  - orgId: 1
    name: 스케줄러
    folder: judozoo
    interval: 1m
    rules:
      - uid: scheduler-swallowed-errors
        title: 스케줄러 잡이 실패를 삼키고 있다
        condition: THRESHOLD
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 {{ $values.QUERY.Value }}건 실패 — 화면은 멀쩡하고 로그에만 warning이 남는다'
          runbook: 'docs/tasks/020-prometheus-메트릭.md'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: QUERY
              instant: true
              expr: sum by (job_id) (increase(scheduler_job_errors_total[10m]))
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [2]

      - uid: scheduler-missed-runs
        title: 스케줄러 잡이 밀리고 있다
        condition: THRESHOLD
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '스케줄러 스레드가 5분째 모두 일하고 있다 — 다른 폴러가 차례를 기다린다'
          runbook: 'docs/tasks/020-prometheus-메트릭.md'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: QUERY
              instant: true
              expr: sum(executor_active_threads{job="backend", name="taskScheduler"}) / sum(executor_pool_core_threads{job="backend", name="taskScheduler"})
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0.99]

  - orgId: 1
    name: 로그
    folder: judozoo
    interval: 1m
    rules:
      - uid: log-error-storm
        title: 에러 로그가 쏟아지고 있다
        condition: THRESHOLD
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 backend ERROR {{ $values.QUERY.Value }}건 (평소 중앙 2건, 24시간 최대 11건)'
          runbook: 'Grafana "Log Monitoring"에서 Level=error로 좁혀 본다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: QUERY
              instant: true
              expr: sum(increase(logback_events_total{job="backend", level="error"}[10m]))
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [15]

      - uid: log-unhandled-exception
        title: 사용자에게 500이 나가고 있다
        condition: THRESHOLD
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 500 응답 {{ $values.QUERY.Value }}건'
          runbook: 'Grafana "메트릭"의 API 5xx에서 경로를, "사용자 여정"에서 그 사용자의 에러를 본다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: QUERY
              instant: true
              expr: sum(increase(http_server_requests_seconds_count{job="backend", status=~"5.."}[10m]))
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

  - orgId: 1
    name: 가입
    folder: judozoo
    interval: 1m
    rules:
      - uid: new-signup
        title: 신규 가입
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          kind: signup
        annotations:
          summary: '{{ if $labels.id }}{{ $labels.at }}, {{ $labels.id }}번 사용자가 가입했습니다{{ else }}가입 규칙이 질의에 실패했습니다 — Grafana에서 규칙 상태를 본다{{ end }}'
          runbook: 'Grafana "이용 현황"의 가입자 표에서 번호로 누구인지 본다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: judozoo-mysql
            model:
              refId: QUERY
              datasource: { type: mysql, uid: judozoo-mysql }
              format: table
              rawQuery: true
              rawSql: "SELECT CAST(id AS CHAR) AS id, DATE_FORMAT(created_at, '%m-%d %H:%i') AS at, 1 AS value FROM app_user WHERE created_at >= NOW() - INTERVAL 10 MINUTE;"
          - refId: REDUCE
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: REDUCE
              type: reduce
              expression: QUERY
              reducer: last
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: REDUCE
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: 의견
    folder: judozoo
    interval: 1m
    rules:
      - uid: new-feedback
        title: 새 의견
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          kind: feedback
        annotations:
          summary: '{{ if $labels.id }}{{ $labels.at }}, {{ $labels.user }}번 사용자 — {{ $labels.excerpt }}{{ else }}의견 규칙이 질의에 실패했습니다 — Grafana에서 규칙 상태를 본다{{ end }}'
          runbook: '전문은 Grafana에서 feedback 표를 본다. 누구인지는 "이용 현황"의 가입자 표에서 번호로 찾는다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: judozoo-mysql
            model:
              refId: QUERY
              datasource: { type: mysql, uid: judozoo-mysql }
              format: table
              rawQuery: true
              rawSql: "SELECT CAST(id AS CHAR) AS id, COALESCE(CAST(user_id AS CHAR), '?') AS user, DATE_FORMAT(created_at, '%m-%d %H:%i') AS at, REPLACE(REPLACE(LEFT(content, 120), CHAR(13), ' '), CHAR(10), ' ') AS excerpt, 1 AS value FROM feedback WHERE created_at >= NOW() - INTERVAL 10 MINUTE;"
          - refId: REDUCE
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: REDUCE
              type: reduce
              expression: QUERY
              reducer: last
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: REDUCE
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: 탈퇴
    folder: judozoo
    interval: 1m
    rules:
      - uid: new-withdraw
        title: 탈퇴
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          kind: withdraw
        annotations:
          summary: '{{ if $labels.user }}{{ $labels.user }}번 사용자가 탈퇴했습니다 (보낸 의견도 함께 삭제){{ else }}탈퇴 규칙이 질의에 실패했습니다 — Grafana에서 규칙 상태를 본다{{ end }}'
          runbook: 'Grafana "사용자 여정"에서 그 번호로 탈퇴 전 무엇을 봤는지 본다'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: QUERY
              datasource: { type: loki, uid: loki }
              queryType: instant
              expr: 'sum by (user) (count_over_time({service="backend"} | json | logger = "judozoo.auth.application.AuthService" | msg =~ "탈퇴.*" [10m]))'
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: 왜 오르나
    folder: judozoo
    interval: 1m
    rules:
      - uid: insight-vertex-client-error
        title: Vertex 클라이언트 오류로 사유 생성이 멈췄다
        condition: THRESHOLD
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '최근 10분 {{ $values.QUERY.Value }}건 — 프롬프트·스키마(400), IAM·API(403), 모델 이름(404)을 본다. 고쳐 재배포하면 서킷이 닫힌다'
          runbook: 'docs/tasks/026-주도주-왜-오르나.md'
        data:
          - refId: QUERY
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: QUERY
              instant: true
              expr: sum(increase(llm_failures_total{kind="client_error"}[10m]))
          - refId: THRESHOLD
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
