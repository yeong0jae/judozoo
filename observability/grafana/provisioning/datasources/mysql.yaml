# 가입자 패널이 app_user를 읽는다. 계정은 remote_deploy.sh가 만들고 SELECT 권한을
# app_user 한 테이블로 제한한다 — 관측 도구에 DB 전체를 열어줄 이유가 없다.
# 비밀번호는 secrets/.env의 GF_MYSQL_PASSWORD (Grafana가 $VAR를 전개한다).
apiVersion: 1

datasources:
  - name: MySQL
    type: mysql
    uid: judozoo-mysql
    url: $DB_HOST:3306
    database: trading
    user: grafana
    secureJsonData:
      password: $GF_MYSQL_PASSWORD
    jsonData:
      # 세션 시간대(jsonData.timezone)는 TIMESTAMP에만 듣는다. 우리 컬럼은 DATETIME이라
      # 시간대 정보가 없고 Grafana가 UTC로 도장을 찍는다 — 쿼리에서 처리한다(usage.json 참고).
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 14400
