# kis-vts 인스턴스 — KIS 모의투자 + leadingstock용 Kiwoom 모의
kis:
  rate-limit-per-second: 1         # 모의투자는 초당 1건 (2건/초도 EGW00201 발생)
  app-key: ${VTS_KIS_APP_KEY}
  app-secret: ${VTS_KIS_APP_SECRET}
  account-no: ${VTS_KIS_ACCOUNT_NO}
  account-product-code: ${VTS_KIS_ACCOUNT_PRODUCT_CODE}
  hts-id: ${KIS_HTS_ID}
  base-url: https://openapivts.koreainvestment.com:29443
  ws-url: ws://ops.koreainvestment.com:31000
  market-div-code: J               # VTS는 NXT 미지원 — KRX 단독
  exchange-id: KRX                 # VTS는 SOR 미지원 — KRX 직접
  tr:
    buy: VTTC0012U
    sell: VTTC0011U
    cancel: VTTC0013U
    balance: VTTC8434R
    execution-notice: H0STCNI9
  # VTS 미지원 quotation API(search-stock-info, chk-holiday)는 실거래 자격증명으로 호출
  real-quotation:
    app-key: ${REAL_KIS_APP_KEY}
    app-secret: ${REAL_KIS_APP_SECRET}
    base-url: https://openapi.koreainvestment.com:9443

kiwoom:
  api:
    base-url: https://mockapi.kiwoom.com
    app-key: ${VTS_KIWOOM_APP_KEY:}
    app-secret: ${VTS_KIWOOM_APP_SECRET:}
  trading:
    account-no: ${VTS_KIWOOM_ACCOUNT_NO:}
    ws-url: wss://mockapi.kiwoom.com:10000/api/dostk/websocket
    dmst-stex-tp: KRX
