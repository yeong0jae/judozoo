# 환경변수 이름은 Python 백엔드 시절(028 이전)과 같다 — `secrets/.env`·Secret Manager 값을 그대로 받는다.
spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:33061}/${DB_NAME:trading}?characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # 스키마 주인은 Flyway다(`db/migration`). 운영 DB는 Alembic 시절에 이미 V1 상태라 기준선만 찍는다
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    # JPA는 맞는지 보기만 한다 — 스키마를 바꾸는 건 Flyway 마이그레이션이다
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # `@Scheduled`는 기본이 스레드 하나다 — 왜 오르나가 Vertex를 1분 가까이 기다리는 동안 1분 스냅샷·시세 폴러가 밀린다.
  # 한 작업이 겹쳐 돌지는 않는다(앞 실행이 끝나야 다음 시각을 잡는다)
  task:
    scheduling:
      pool:
        size: 8

server:
  port: 8001
  # 리다이렉트(로그인 콜백 → `/`)를 상대 주소로 보낸다. 절대 주소로 바꾸면 TLS가 끝난 뒤 받은 http를 써서 `http://judozoo.com/`으로 보낸다
  tomcat:
    use-relative-redirects: true

judozoo:
  # 세션 쿠키 서명 키. Python(Starlette) 시절에 발급한 쿠키도 이 키로 읽힌다
  session-secret: ${SESSION_SECRET:dev-only-insecure}
  # 브로커 앱키·시크릿. 토큰 발급도 여기서 한다. 한도(`*-permits-per-second`)는 각 Properties 기본값이 브로커 한도에 맞춰 있다 —
  # 바꿀 때는 `JUDOZOO_KIWOOM_QUERY_PERMITS_PER_SECOND`처럼 이 이름으로 덮어쓴다
  kis:
    app-key: ${REAL_KIS_APP_KEY:}
    app-secret: ${REAL_KIS_APP_SECRET:}
  kiwoom:
    app-key: ${REAL_KIWOOM_APP_KEY:}
    app-secret: ${REAL_KIWOOM_APP_SECRET:}
  toss:
    client-id: ${REAL_TOSS_CLIENT_ID:}
    client-secret: ${REAL_TOSS_CLIENT_SECRET:}
  # 구글 로그인 — 시크릿은 secrets/.env가 준다
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://judozoo.com/api/auth/callback}
  # Gemini on Vertex AI(026) — 비밀값이 아니다
  vertex:
    project: ${VERTEX_PROJECT:trading-496508}
    location: ${VERTEX_LOCATION:global}
    model: ${VERTEX_MODEL:gemini-3.8-flash}
    daily-limit: ${VERTEX_DAILY_LIMIT:150}

# `/actuator/prometheus`는 compose 네트워크 안에서 alloy만 긁는다. **nginx는 `/api/`만 넘긴다** —
# nginx에 `/actuator`를 추가하는 순간 인터넷에 열린다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # 트레이스(021). 기본은 꺼 둔다 — 운영 compose가 켜고 alloy 주소를 준다.
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          transport: grpc
  # alloy는 트레이스만 OTLP로 받는다. 메트릭은 Prometheus 긁기, 로그는 stdout이다
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
