spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:33061}/${DB_NAME:trading}?characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  task:
    scheduling:
      pool:
        size: 8

server:
  port: 8001
  tomcat:
    use-relative-redirects: true
    mbeanregistry:
      enabled: true

judozoo:
  session-secret: ${SESSION_SECRET:dev-only-insecure}
  kis:
    app-key: ${REAL_KIS_APP_KEY:}
    app-secret: ${REAL_KIS_APP_SECRET:}
  kiwoom:
    app-key: ${REAL_KIWOOM_APP_KEY:}
    app-secret: ${REAL_KIWOOM_APP_SECRET:}
  toss:
    client-id: ${REAL_TOSS_CLIENT_ID:}
    client-secret: ${REAL_TOSS_CLIENT_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://judozoo.com/api/auth/callback}
  vertex:
    project: ${VERTEX_PROJECT:trading-496508}
    location: ${VERTEX_LOCATION:global}
    model: ${VERTEX_MODEL:gemini-3.8-flash}
    daily-limit: ${VERTEX_DAILY_LIMIT:150}

management:
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 100ms,250ms,500ms,1s,2s,5s,10s,30s
        "[tasks.scheduled.execution]": 100ms,1s,5s,10s,30s,60s,120s
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: always
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          transport: grpc
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
