spring:
  application:
    name: backend
  profiles:
    active: vts
  datasource:
    url: jdbc:mysql://localhost:33061/trading?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    at.backend: DEBUG

kis:
  rate-limit-per-second: 20        # 실전 기준 — 모의투자(vts)는 1건/초로 override
  # 자격증명/엔드포인트는 profile별 (application-{real,vts}.yaml) — env: VTS_KIS_*, REAL_KIS_*
  # app-key, app-secret, account-no, account-product-code, hts-id, base-url, ws-url, market-div-code, exchange-id, tr.*
  real-quotation:
    # VTS 미지원 quotation API(예: search-stock-info)는 항상 실거래 자격증명으로 호출
    app-key: ${REAL_KIS_APP_KEY}
    app-secret: ${REAL_KIS_APP_SECRET}
    base-url: https://openapi.koreainvestment.com:9443

trading:
  default-buy-interval-min: 3              # 분 단위
  default-split-sell-ratio: 0.2            # 소수 비율 (0.2 = 20%)
  default-midway-profit-pct: 3             # 퍼센트 숫자 (3 = 3%)
  default-breakeven-threshold-pct: 2       # 퍼센트 숫자 (2 = 2%)
  default-stop-loss-pct: 2                 # 퍼센트 숫자, 양수 입력 (2 → 내부 -2%)
  sell-cost-rate: 0.0025                   # 소수 비율 (0.0025 = 0.25%)
  market:
    bar-poll-interval-millis: 10000
  order:
    sell-retry-delay-millis: 5000
    egw-retry-base-delay-millis: 1500   # 매수 EGW00201 재시도 backoff 단위 (실제 backoff: 1×, 2× 단위)
  cycle:
    buy-interval-unit-millis: 60000
    holding-poll-interval-millis: 50
