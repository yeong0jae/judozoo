spring:
  application:
    name: backend
  profiles:
    # 단일 profile 활성화로 충분 — group이 broker × env 두 축 profile로 확장한다.
    active: kis-real
    group:
      kis-real: kis,real
      kiwoom-real: kiwoom,real
  datasource:
    url: jdbc:mysql://localhost:33061/trading?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    at.backend: DEBUG

stock:
  master:
    # KIS 종목정보 마스터 파일 (평문 CDN — OpenAPI 토큰/레이트리밋 무관, vts/real 영향 없음)
    kospi-url: https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip
    kosdaq-url: https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip

leading-stock:
  criteria:
    min-market-cap: 3000                   # 3,000억원 (억원 단위)
    max-trading-value-rank: 30             # 거래대금 상위 30위
    min-daily-price-change-rate: 4.0       # 당일 등락률 4% 이상
    max-high-position-drop-rate: -5.0      # 60봉 고가 대비 -5% 이내
    min-minute-volume-increase-rate: 500.0 # 1분봉 거래대금 증가율 500%
    min-minute-trading-value: 5000000000   # 1분봉 거래대금 50억
    max-minute-fluctuation-rate: 4.0       # 1분봉 등락률 4% 이하
    min-program-net-buy: -10000            # 프로그램 순매수 -100억 이상 (백만원 단위)
    max-prev-close-change-rate: 25.0       # 전일 종가 대비 25% 이하
    max-opening-price-change-rate: 7.0     # 시초가 대비 7% 이하
    max-theme-rank: 5                      # 테마 그룹 상위 N위

trading:
  default-split-sell-ratio: 0.2            # 소수 비율 (0.2 = 20%)
  default-breakeven-threshold-pct: 2       # 퍼센트 숫자 (2 = 2%)
  default-stop-loss-pct: 2                 # 퍼센트 숫자, 양수 입력 (2 → 내부 -2%)
  sell-cost-rate: 0.0025                   # 소수 비율 (0.0025 = 0.25%)
  market:
    bar-poll-interval-millis: 10000
  order:
    sell-retry-delay-millis: 5000
    sell-max-retries: 5                    # 매도 발송 거부 시 최대 재시도 횟수 — 초과 시 중단(무한 재시도 방지)
    egw-retry-base-delay-millis: 1500      # 매수 EGW00201 재시도 backoff 단위
  cycle:
    buy-fill-wait-millis: 30000            # 단일 매수 발송 후 체결 통보 대기 한도 (초과 시 NO_FILL)
    holding-poll-interval-millis: 50
