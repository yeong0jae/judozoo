spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:33061/trading?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    at.backend: DEBUG

kis:
  api:
    base-url: https://openapi.koreainvestment.com:9443
    app-key: ${REAL_KIS_APP_KEY:}
    app-secret: ${REAL_KIS_APP_SECRET:}

kiwoom:
  api:
    base-url: https://api.kiwoom.com
    app-key: ${REAL_KIWOOM_APP_KEY:}
    app-secret: ${REAL_KIWOOM_APP_SECRET:}

toss:
  api:
    base-url: https://openapi.tossinvest.com
    client-id: ${REAL_TOSS_CLIENT_ID:}
    client-secret: ${REAL_TOSS_CLIENT_SECRET:}

stock:
  master:
    # KIS 종목정보 마스터 파일 (평문 CDN — OpenAPI 토큰/레이트리밋 무관, vts/real 영향 없음)
    kospi-url: https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip
    kosdaq-url: https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip
    overseas-urls:
      - https://new.real.download.dws.co.kr/common/master/nasmst.cod.zip
      - https://new.real.download.dws.co.kr/common/master/nysmst.cod.zip
      - https://new.real.download.dws.co.kr/common/master/amsmst.cod.zip

leading-stock:
  criteria:
    min-market-cap: 3000                   # 3,000억원 (억원 단위)
    max-trading-value-rank: 30             # 거래대금 상위 30위
    min-daily-price-change-rate: 7.0       # 당일 등락률 7% 이상
    max-high-position-drop-rate: -5.0      # 60봉 고가 대비 -5% 이내
    min-minute-volume-increase-rate: 500.0 # 1분봉 거래대금 증가율 500%
    min-minute-trading-value: 5000000000   # 1분봉 거래대금 50억
    max-minute-fluctuation-rate: 4.0       # 1분봉 등락률 4% 이하
    min-program-net-buy: -10000            # 프로그램 순매수 -100억 이상 (백만원 단위)
    max-prev-close-change-rate: 25.0       # 전일 종가 대비 25% 이하
    max-opening-price-change-rate: 7.0     # 시초가 대비 7% 이하
    max-theme-rank: 5                      # 테마 그룹 상위 N위
  signal-event:
    # 시그널 로그 폴러 전용 — 후보/돌파/스파이크 페이지 기본값과 분리
    min-change-rate: -12.0                 # 감시 풀 당일 등락률 하한(%) — 하락 종목까지 수집(전시는 화면 필터로, 최하 -12)
    poll-interval-millis: 10000            # 폴링 주기(ms)
    cooldown-minutes: 3                    # 같은 종목·타입 재적재 쿨다운(분) — 프리마켓 출렁임 중복 방지
  market-signal:
    # 코스피/코스닥 투자자 순매수 단계(조/천억) 전이 폴러
    poll-interval-millis: 120000           # 순매수 폴링 주기(ms) — 누적은 느리게 변해 2분
    candle-poll-interval-millis: 30000     # 지수 반등(5분봉 20이평 돌파) 판정 폴링 주기(ms)
    session-start: "09:00"                 # 지수 폴링 시작 — 정규장 개장(지수는 정규장에만 체결)
    session-end: "15:30"                   # 지수 폴링 종료 — 정규장 마감(종가 단일가 포함)
