spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:33061/trading?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    at.backend: DEBUG

kis:
  app-key: ${KIS_APP_KEY}
  app-secret: ${KIS_APP_SECRET}
  account-no: ${KIS_ACCOUNT_NO}
  account-product-code: ${KIS_ACCOUNT_PRODUCT_CODE}
  base-url: https://openapi.koreainvestment.com:9443
  ws-url: ws://ops.koreainvestment.com:21000
  rate-limit-per-second: 20

trading:
  market-close-time: "15:30"
  default-buy-interval-min: 3              # 분 단위
  default-split-sell-ratio: 0.2            # 소수 비율 (0.2 = 20%)
  default-midway-profit-pct: 3             # 퍼센트 숫자 (3 = 3%)
  default-breakeven-threshold-pct: 2       # 퍼센트 숫자 (2 = 2%)
  default-stop-loss-pct: 2                 # 퍼센트 숫자, 양수 입력 (2 → 내부 -2%)
  sell-cost-rate: 0.0025                   # 소수 비율 (0.0025 = 0.25%)
  market:
    bar-poll-interval-millis: 30000
  order:
    sell-retry-delay-millis: 5000
