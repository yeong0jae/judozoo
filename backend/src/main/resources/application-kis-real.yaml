# kis-real 인스턴스 — KIS 실전 + leadingstock용 Kiwoom 실전
kis:
  rate-limit-per-second: 20
  app-key: ${REAL_KIS_APP_KEY}
  app-secret: ${REAL_KIS_APP_SECRET}
  account-no: ${REAL_KIS_ACCOUNT_NO}
  account-product-code: ${REAL_KIS_ACCOUNT_PRODUCT_CODE}
  hts-id: ${KIS_HTS_ID}
  base-url: https://openapi.koreainvestment.com:9443
  ws-url: ws://ops.koreainvestment.com:21000
  market-div-code: UN              # FID_COND_MRKT_DIV_CODE — KRX+NXT 통합 시세
  exchange-id: SOR                 # EXCG_ID_DVSN_CD — Smart Order Routing
  tr:
    buy: TTTC0012U
    sell: TTTC0011U
    cancel: TTTC0013U
    balance: TTTC8434R
    execution-notice: H0STCNI0
  # 메인 KisRestClient도 REAL_KIS 키로 동작 — KisTokenRegistry가 같은 appKey 캐시 공유
  real-quotation:
    app-key: ${REAL_KIS_APP_KEY}
    app-secret: ${REAL_KIS_APP_SECRET}
    base-url: https://openapi.koreainvestment.com:9443

kiwoom:
  api:
    base-url: https://api.kiwoom.com
    app-key: ${REAL_KIWOOM_APP_KEY:}
    app-secret: ${REAL_KIWOOM_APP_SECRET:}
  trading:
    account-no: ${REAL_KIWOOM_ACCOUNT_NO:}
    ws-url: wss://api.kiwoom.com:10000/api/dostk/websocket
    dmst-stex-tp: SOR              # KRX+NXT 통합 라우팅 (NXT 애프터마켓 시간대 주문 자동 라우팅)
