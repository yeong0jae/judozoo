# 스키마 마이그레이션. DB 주소는 여기 적지 않고 migrations/env.py가 settings에서 읽는다.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
# 날짜를 앞에 붙여 파일 목록이 적용 순서대로 보이게 한다. 실제 순서는 down_revision이 정한다.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
