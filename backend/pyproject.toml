[project]
name = "backend"
version = "0.1.0"
description = "주도주 매매 판단 보조 시스템 백엔드 (Python 이관)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cachetools>=5.5",
    "httpx>=0.28",
    "apscheduler>=3.11.3",
    "authlib>=1.3",          # 구글 OAuth + ID 토큰 검증
    "itsdangerous>=2.2",     # Starlette SessionMiddleware가 쿠키 서명에 쓴다
    "prometheus-fastapi-instrumentator>=7.0",  # prometheus-client가 딸려온다
    # OpenTelemetry — 021. sdk/exporter는 버전을 함께 올려야 하고,
    # instrumentation-* 는 별도 버전 라인(0.x)이다.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "google-auth[requests]>=2.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "respx>=0.23.1",
    "testcontainers[mysql]>=4.9",
    "pyyaml>=6.0",           # 알림 규칙 파일을 읽어 SQL을 그대로 시험한다
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 통합 테스트는 Docker가 필요하다. `-m "not integration"` 으로 제외할 수 있다.
markers = ["integration: Docker(Testcontainers)가 필요한 테스트"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
