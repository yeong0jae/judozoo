# 환경변수 이름은 Python 백엔드(`backend/src/backend/settings.py`)와 같다 — 같은 `.env`·Secret Manager 값을 그대로 받는다.
spring:
  application:
    name: backend-kotlin
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:33061}/${DB_NAME:trading}?characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    # 공존하는 동안 스키마 주인은 Alembic이다(028). JPA는 맞는지 보기만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8001

judozoo:
  # Python `SessionMiddleware`와 같은 키여야 그 쿠키를 읽는다
  session-secret: ${SESSION_SECRET:dev-only-insecure}

# `/actuator/prometheus`는 compose 네트워크 안에서 alloy만 긁는다. **nginx는 `/api/`만 넘긴다** —
# nginx에 `/actuator`를 추가하는 순간 인터넷에 열린다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # 트레이스(021). 기본은 꺼 둔다 — 운영 compose가 켜고 alloy 주소를 준다(Python `OTLP_ENDPOINT`와 같은 자리).
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          transport: grpc
  # alloy는 트레이스만 OTLP로 받는다. 메트릭은 Prometheus 긁기, 로그는 stdout이다
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
