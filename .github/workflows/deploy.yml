name: deploy

on:
  push:
    branches: [main]
    # 문서만 바뀐 커밋에 이미지 3개를 다시 빌드하고 VM 두 대를 재배포할 이유가 없다.
    # 아래 경로만 바뀐 커밋은 워크플로가 **아예 실행되지 않는다** — 배포 기록이 남지
    # 않으므로 "이 커밋은 왜 배포가 없지"로 한 번 놀랄 수 있다. 문서 변경은 다음 코드
    # 커밋이 올라갈 때 함께 나간다. 당장 반영이 필요하면 workflow_dispatch로 돌린다.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**.md'
  # 시크릿은 배포할 때 remote_deploy.sh가 Secret Manager에서 읽어 온다.
  # 즉 값만 바꾸면 아무 일도 안 일어나고 배포를 한 번 태워야 반영된다 —
  # 코드 변경 없이 그걸 하려면 수동 실행이 필요하다.
  workflow_dispatch:

# 같은 VM에 동시 배포 시 완료 순서 역전·파일 동기화 레이스를 막기 위해 직렬화.
# 진행 중 배포는 끝까지 두고, 그 사이 쌓인 푸시는 가장 최신 것만 이어서 배포된다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# WIF용 OIDC 토큰 발급 권한
permissions:
  contents: read
  id-token: write

# 값은 GitHub Actions Variables(Settings → Secrets and variables → Actions → Variables)에서 주입.
# 비밀 아님(식별자) — Secrets 아니라 Variables 사용.
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.AR_REPO }}
  VM_ZONE: ${{ vars.VM_ZONE }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SA: ${{ vars.DEPLOY_SA }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 이미지별로 러너를 나눠 병렬 빌드. 디렉터리명 = 이미지명 = 빌드 컨텍스트.
        image: [backend, frontend]
    name: build ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # token_format=access_token: buildx 컨테이너 빌더가 credential helper 없이
      # 정적 토큰으로 AR에 푸시하도록 docker login에 직접 주입.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: google-github-actions/setup-gcloud@v2

      # **태그를 커밋 SHA가 아니라 그 디렉터리의 git 트리 해시로 붙인다.**
      # 커밋 SHA는 매 커밋 바뀌므로, 내용이 같아도 compose가 "다른 이미지"로 보고
      # 컨테이너를 재생성했다 — 프론트 문구 하나 고치면 장중에 백엔드가 재시작됐다.
      # 트리 해시는 그 디렉터리 내용이 바뀔 때만 변한다(Dockerfile 포함).
      - name: Resolve tag
        id: tag
        run: echo "value=$(git rev-parse HEAD:${{ matrix.image }})" >> "$GITHUB_OUTPUT"

      # 같은 내용의 이미지가 이미 레지스트리에 있으면 빌드를 건너뛴다.
      #
      # **이건 속도 최적화가 아니라 재생성을 막는 핵심이다.** 같은 태그로 다시 빌드하면
      # 빌드가 재현 가능하지 않은 이상 digest가 달라지고, `pull_policy: always`가 그걸
      # 받아와 결국 컨테이너를 재생성한다. 안 바뀐 서비스는 **아예 밀어 올리지 않아야** 한다.
      #
      # workflow_dispatch로 돌리면 항상 다시 빌드한다 — 베이스 이미지 보안 패치를
      # 가져오는 유일한 경로다(내용이 안 바뀌면 영영 재빌드되지 않기 때문에).
      - name: Check existing
        id: exists
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          elif gcloud artifacts docker images describe \
                 "${AR_REPO}/${{ matrix.image }}:${{ steps.tag.outputs.value }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이미 있음 — 빌드 건너뜀"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'

      - name: Build & push ${{ matrix.image }}
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ env.AR_REPO }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.AR_REPO }}/${{ matrix.image }}:latest
          # GHA 캐시로 의존성 레이어(uv sync / npm ci) 재사용 — 매 실행 재다운로드 방지
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # 관측 VM. 앱보다 먼저 세워야 alloy가 Loki를 찾지 못해 재시도하는 구간이 없다.
  # 빌드에 의존하지 않는다 — loki·grafana는 공개 이미지다.
  deploy-ops:
    runs-on: ubuntu-latest
    name: deploy ops
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync compose + deploy script to ops VM
        run: |
          # **rm 하지 않는다.** 디렉터리·파일 inode가 바뀌면 재사용된 컨테이너의 bind mount가
          # 끊긴다(020에서 Grafana 프로비저닝이 두 배포 동안 조용히 죽은 원인). scp는 기존
          # 파일을 truncate해 덮으므로 inode가 보존된다. rm이 있던 이유는 실패한 배포가
          # root 소유로 남긴 디렉터리가 scp를 막았기 때문인데, 소유권만 고치면 된다.
          gcloud compute ssh "${{ vars.VM_NAME_OPS }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command 'sudo mkdir -p ~/observability && sudo chown -R "$(id -u):$(id -g)" ~/observability'
          gcloud compute scp --tunnel-through-iap --zone "${VM_ZONE}" --recurse \
            docker-compose.ops.yml docker-compose.ops.prod.yml infra/deploy/remote_deploy_ops.sh observability \
            "${{ vars.VM_NAME_OPS }}:~/"

      # 설정 디렉터리별 트리 해시. 바뀐 서비스만 재생성된다 — 예전에는 --force-recreate로
      # 매 배포마다 loki·prometheus·tempo가 재시작해 수집에 공백이 생겼다.
      - name: Resolve config hashes
        id: cfg
        run: |
          {
            echo "loki=$(git rev-parse HEAD:observability/loki)"
            echo "prometheus=$(git rev-parse HEAD:observability/prometheus)"
            echo "tempo=$(git rev-parse HEAD:observability/tempo)"
            echo "grafana=$(git rev-parse HEAD:observability/grafana)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy on ops VM
        run: |
          gcloud compute ssh "${{ vars.VM_NAME_OPS }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command "bash ~/remote_deploy_ops.sh \
              ${{ steps.cfg.outputs.loki }} \
              ${{ steps.cfg.outputs.prometheus }} \
              ${{ steps.cfg.outputs.tempo }} \
              ${{ steps.cfg.outputs.grafana }}"

  deploy:
    needs: [build, deploy-ops]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                 # 한 인스턴스 실패해도 다른 인스턴스 배포 계속
      matrix:
        target:
          - key: app
            vm_var: VM_NAME_APP
    name: deploy ${{ matrix.target.key }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve VM name
        id: vm
        run: echo "name=${{ vars[matrix.target.vm_var] }}" >> "$GITHUB_OUTPUT"

      - name: Sync compose + deploy script to VM
        run: |
          # **rm 하지 않는다.** 디렉터리·파일 inode가 바뀌면 재사용된 컨테이너의 bind mount가
          # 끊긴다(020에서 Grafana 프로비저닝이 두 배포 동안 조용히 죽은 원인). scp는 기존
          # 파일을 truncate해 덮으므로 inode가 보존된다. rm이 있던 이유는 실패한 배포가
          # root 소유로 남긴 디렉터리가 scp를 막았기 때문인데, 소유권만 고치면 된다.
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command 'sudo mkdir -p ~/observability && sudo chown -R "$(id -u):$(id -g)" ~/observability'
          gcloud compute scp --tunnel-through-iap --zone "${VM_ZONE}" --recurse \
            docker-compose.yml docker-compose.prod.yml infra/deploy/remote_deploy.sh observability \
            "${{ steps.vm.outputs.name }}:~/"

      # Deploy + 헬스체크를 한 SSH 세션에서 — remote_deploy.sh 마지막이 VM 내부 localhost:3000을 검사.
      # (방화벽이 프론트 3000을 특정 IP로만 열 수 있어 러너에서 외부로 치지 않음)
      # 빌드 때와 **같은 방식으로** 태그를 다시 구한다. 안 바뀐 서비스는 값이 그대로라
      # compose가 그 컨테이너를 건드리지 않는다 — 이 작업의 목적이다.
      - name: Resolve tags
        id: tags
        run: |
          {
            echo "backend=$(git rev-parse HEAD:backend)"
            echo "frontend=$(git rev-parse HEAD:frontend)"
            echo "alloy=$(git rev-parse HEAD:observability/alloy)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy on VM
        run: |
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command "bash ~/remote_deploy.sh ${AR_REPO} ${REGION} \
              ${{ steps.tags.outputs.backend }} \
              ${{ steps.tags.outputs.frontend }} \
              ${{ steps.tags.outputs.alloy }}"
