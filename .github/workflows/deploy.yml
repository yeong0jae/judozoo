name: deploy

on:
  push:
    branches: [main]

# 같은 VM에 동시 배포 시 완료 순서 역전·파일 동기화 레이스를 막기 위해 직렬화.
# 진행 중 배포는 끝까지 두고, 그 사이 쌓인 푸시는 가장 최신 것만 이어서 배포된다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# WIF용 OIDC 토큰 발급 권한
permissions:
  contents: read
  id-token: write

# 값은 GitHub Actions Variables(Settings → Secrets and variables → Actions → Variables)에서 주입.
# 비밀 아님(식별자) — Secrets 아니라 Variables 사용.
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.AR_REPO }}
  VM_ZONE: ${{ vars.VM_ZONE }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SA: ${{ vars.DEPLOY_SA }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 이미지별로 러너를 나눠 병렬 빌드. 디렉터리명 = 이미지명 = 빌드 컨텍스트.
        image: [backend, frontend, python-backend]
    name: build ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # token_format=access_token: buildx 컨테이너 빌더가 credential helper 없이
      # 정적 토큰으로 AR에 푸시하도록 docker login에 직접 주입.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ env.AR_REPO }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.AR_REPO }}/${{ matrix.image }}:latest
          # GHA 캐시로 의존성 레이어(gradle deps / npm ci) 재사용 — 매 실행 재다운로드 방지
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                 # 한 인스턴스 실패해도 다른 인스턴스 배포 계속
      matrix:
        target:
          - key: kiwoom-real
            profile: kiwoom-real
            vm_var: VM_NAME_KIWOOM_REAL
    name: deploy ${{ matrix.target.key }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve VM name
        id: vm
        run: echo "name=${{ vars[matrix.target.vm_var] }}" >> "$GITHUB_OUTPUT"

      - name: Sync compose + deploy script to VM
        run: |
          # 이전 실패 배포에서 docker가 root 소유 빈 디렉토리로 만들어둔 observability 잔재 제거 후 재동기화
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command 'sudo rm -rf ~/observability'
          gcloud compute scp --tunnel-through-iap --zone "${VM_ZONE}" --recurse \
            docker-compose.yml docker-compose.prod.yml infra/deploy/remote_deploy.sh observability \
            "${{ steps.vm.outputs.name }}:~/"

      # Deploy + 헬스체크를 한 SSH 세션에서 — remote_deploy.sh 마지막이 VM 내부 localhost:3000을 검사.
      # (방화벽이 프론트 3000을 특정 IP로만 열 수 있어 러너에서 외부로 치지 않음)
      - name: Deploy on VM
        run: |
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command "bash ~/remote_deploy.sh ${GITHUB_SHA} ${AR_REPO} ${REGION} '${{ matrix.target.profile }}'"
