name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.AR_REPO }}
  VM_ZONE: ${{ vars.VM_ZONE }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SA: ${{ vars.DEPLOY_SA }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    name: build ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve tag
        id: tag
        run: echo "value=$(git rev-parse HEAD:${{ matrix.image }})" >> "$GITHUB_OUTPUT"

      - name: Check existing
        id: exists
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          elif gcloud artifacts docker images describe \
                 "${AR_REPO}/${{ matrix.image }}:${{ steps.tag.outputs.value }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이미 있음 — 빌드 건너뜀"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'

      - name: Build & push ${{ matrix.image }}
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ env.AR_REPO }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.AR_REPO }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-ops:
    runs-on: ubuntu-latest
    name: deploy ops
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect ops changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "ops=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
                 observability ':(exclude)observability/alloy' \
                 docker-compose.ops.yml docker-compose.ops.prod.yml \
                 infra/deploy/remote_deploy_ops.sh .github/workflows/deploy.yml; then
            echo "ops=false" >> "$GITHUB_OUTPUT"
            echo "관측 스택 변경 없음 — 배포 건너뜀"
          else
            echo "ops=true" >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        if: steps.changes.outputs.ops == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.changes.outputs.ops == 'true'

      - name: Speed up IAP tunnel uploads
        if: steps.changes.outputs.ops == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/gcloud-py"
          "$RUNNER_TEMP/gcloud-py/bin/pip" install --quiet numpy
          {
            echo "CLOUDSDK_PYTHON=$RUNNER_TEMP/gcloud-py/bin/python"
            echo "CLOUDSDK_PYTHON_SITEPACKAGES=1"
          } >> "$GITHUB_ENV"

      - name: Sync compose + deploy script to ops VM
        if: steps.changes.outputs.ops == 'true'
        run: |
          mkdir -p deploy-sync
          cp -r docker-compose.ops.yml docker-compose.ops.prod.yml infra/deploy/remote_deploy_ops.sh observability deploy-sync/
          gcloud compute scp --tunnel-through-iap --zone "${VM_ZONE}" --recurse \
            deploy-sync "${{ vars.VM_NAME_OPS }}:~/"

      - name: Resolve config hashes
        id: cfg
        if: steps.changes.outputs.ops == 'true'
        run: |
          {
            echo "loki=$(git rev-parse HEAD:observability/loki)"
            echo "prometheus=$(git rev-parse HEAD:observability/prometheus)"
            echo "tempo=$(git rev-parse HEAD:observability/tempo)"
            echo "grafana=$(git rev-parse HEAD:observability/grafana)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy on ops VM
        if: steps.changes.outputs.ops == 'true'
        run: |
          gcloud compute ssh "${{ vars.VM_NAME_OPS }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command "sudo mkdir -p ~/observability && sudo chown -R \$(id -u):\$(id -g) ~/observability \
              && cp -r ~/deploy-sync/. ~/ \
              && bash ~/remote_deploy_ops.sh \
              ${{ steps.cfg.outputs.loki }} \
              ${{ steps.cfg.outputs.prometheus }} \
              ${{ steps.cfg.outputs.tempo }} \
              ${{ steps.cfg.outputs.grafana }}"

  deploy:
    needs: [build, deploy-ops]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - key: app
            vm_var: VM_NAME_APP
    name: deploy ${{ matrix.target.key }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Speed up IAP tunnel uploads
        run: |
          python3 -m venv "$RUNNER_TEMP/gcloud-py"
          "$RUNNER_TEMP/gcloud-py/bin/pip" install --quiet numpy
          {
            echo "CLOUDSDK_PYTHON=$RUNNER_TEMP/gcloud-py/bin/python"
            echo "CLOUDSDK_PYTHON_SITEPACKAGES=1"
          } >> "$GITHUB_ENV"

      - name: Resolve VM name
        id: vm
        run: echo "name=${{ vars[matrix.target.vm_var] }}" >> "$GITHUB_OUTPUT"

      - name: Sync compose + deploy script to VM
        run: |
          mkdir -p deploy-sync
          cp -r docker-compose.yml docker-compose.prod.yml infra/deploy/remote_deploy.sh observability deploy-sync/
          gcloud compute scp --tunnel-through-iap --zone "${VM_ZONE}" --recurse \
            deploy-sync "${{ steps.vm.outputs.name }}:~/"

      - name: Resolve tags
        id: tags
        run: |
          {
            echo "backend=$(git rev-parse HEAD:backend)"
            echo "frontend=$(git rev-parse HEAD:frontend)"
            echo "alloy=$(git rev-parse HEAD:observability/alloy)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy on VM
        run: |
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command "sudo mkdir -p ~/observability && sudo chown -R \$(id -u):\$(id -g) ~/observability \
              && cp -r ~/deploy-sync/. ~/ \
              && bash ~/remote_deploy.sh ${AR_REPO} ${REGION} \
              ${{ steps.tags.outputs.backend }} \
              ${{ steps.tags.outputs.frontend }} \
              ${{ steps.tags.outputs.alloy }}"
