name: deploy

on:
  push:
    branches: [main]

# WIF용 OIDC 토큰 발급 권한
permissions:
  contents: read
  id-token: write

# 값은 GitHub Actions Variables(Settings → Secrets and variables → Actions → Variables)에서 주입.
# 비밀 아님(식별자) — Secrets 아니라 Variables 사용.
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.AR_REPO }}
  VM_ZONE: ${{ vars.VM_ZONE }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SA: ${{ vars.DEPLOY_SA }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]   # 두 이미지를 별도 러너에서 병렬 빌드
    name: build ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # token_format=access_token: buildx 컨테이너 빌더가 credential helper 없이
      # 정적 토큰으로 AR에 푸시하도록 docker login에 직접 주입.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ env.AR_REPO }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.AR_REPO }}/${{ matrix.image }}:latest
          # GHA 캐시로 의존성 레이어(gradle deps / npm ci) 재사용 — 매 실행 재다운로드 방지
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                 # 한 인스턴스 실패해도 다른 인스턴스 배포 계속
      matrix:
        target:
          - key: kis-real
            profile: kis-real
            vm_var: VM_NAME_KIS_REAL
          - key: kiwoom-real
            profile: kiwoom-real
            vm_var: VM_NAME_KIWOOM_REAL
    name: deploy ${{ matrix.target.key }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve VM name
        id: vm
        run: echo "name=${{ vars[matrix.target.vm_var] }}" >> "$GITHUB_OUTPUT"

      - name: Sync compose + deploy script to VM
        run: |
          # 이전 실패 배포에서 docker가 root 소유 빈 디렉토리로 만들어둔 observability 잔재 제거 후 재동기화
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command 'sudo rm -rf ~/observability'
          gcloud compute scp --tunnel-through-iap --zone "${VM_ZONE}" --recurse \
            docker-compose.yml docker-compose.prod.yml infra/deploy/remote_deploy.sh observability \
            "${{ steps.vm.outputs.name }}:~/"

      - name: Deploy on VM
        run: |
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command "bash ~/remote_deploy.sh ${GITHUB_SHA} ${AR_REPO} ${REGION} '${{ matrix.target.profile }}'"

      # 방화벽이 프론트(3000)를 특정 IP로만 열 수 있으므로 러너에서 외부로 치지 않고
      # 이미 열린 IAP SSH로 VM 내부에서 localhost 검사 (방화벽과 무관).
      - name: Health check (VM 내부)
        run: |
          gcloud compute ssh "${{ steps.vm.outputs.name }}" --tunnel-through-iap --zone "${VM_ZONE}" \
            --command 'set -e; for i in $(seq 1 24); do if curl -fsS http://localhost:3000/ >/dev/null; then echo "health OK ($i)"; exit 0; fi; echo "not ready, retry $i"; sleep 10; done; echo "health check failed"; exit 1'
