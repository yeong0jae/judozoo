name: Fix
description: 버그 수정
title: "fix: "
labels: ["fix"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 어떤 동작이 잘못되었나 (재현 단계 포함하면 좋음)
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: 원인
      description: 분석되었거나 추정되는 원인
  - type: textarea
    id: solution
    attributes:
      label: 해결 방안
      description: 어떻게 수정할지
    validations:
      required: true
