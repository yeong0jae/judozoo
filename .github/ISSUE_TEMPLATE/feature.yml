name: Feature
description: 새 기능 추가
title: "feat: "
labels: ["feat"]
body:
  - type: textarea
    id: overview
    attributes:
      label: 개요
      description: 무엇을 / 왜
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 핵심 작업
      description: bullet 형식
      placeholder: |
        - 작업 1
        - 작업 2
    validations:
      required: true
  - type: input
    id: tasks-link
    attributes:
      label: 상세 체크리스트 (있으면)
      description: tasks-NNN.md 파일 경로
      placeholder: docs/tasks/tasks-NNN.md
